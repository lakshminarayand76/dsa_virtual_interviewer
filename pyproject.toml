[project]
name = "ai-interviewer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lakshminarayan22", email = "dlakshminarayan22@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.3.0",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.1",
    "langgraph>=1.2.11",
    "numpy>=2.4.6",
    "pygame>=2.6.1",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "scipy>=1.17.1",
    "sounddevice>=0.5.6",
    "streamlit>=1.63.0",
    "streamlit-ace>=0.1.1",
]

[project.scripts]
ai-interviewer = "ai_interviewer:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
